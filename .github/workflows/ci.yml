name: CI

on:
  push:
    branches: [main]
  pull_request:

# Um push novo cancela a execucao anterior do mesmo branch: nao adianta
# terminar de testar um commit que ja foi substituido.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: estilo e sintaxe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: conferir sintaxe de todos os arquivos
        run: npm run lint

  test:
    name: testes (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # A suite roda offline, no PGlite em memoria. E o portao rapido.
      - name: suite offline
        run: npm test

  postgres:
    name: testes contra Postgres
    runs-on: ubuntu-latest
    # O PGlite e o mesmo Postgres em WASM, mas nao e um servidor com pool e
    # rede no meio. Este job e o segundo driver.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: uniwork
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: suite contra Postgres de verdade
        run: node --test --test-concurrency=4 "tests/**/*.test.js"
        env:
          DATABASE_URL: postgresql://postgres:uniwork@127.0.0.1:5432/postgres
          UNIWORK_FORCA_POSTGRES: '1'

  driver-anchor:
    name: suite com o driver do programa
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: suite com ESCROW_DRIVER=anchor
        run: npm run test:anchor

  programa:
    name: programa Anchor
    runs-on: ubuntu-latest
    # So quando o programa muda: compilar Rust e caro e nada mais depende disso.
    if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'programa')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: o programa mudou?
        id: mudou
        run: |
          if git diff --name-only HEAD^ HEAD | grep -q '^programs/'; then
            echo "sim=true" >> "$GITHUB_OUTPUT"
          else
            echo "sim=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.mudou.outputs.sim == 'true'
        with:
          node-version: 22
          cache: npm
      - name: instalar Solana e Anchor
        if: steps.mudou.outputs.sim == 'true'
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
          cargo install --git https://github.com/coral-xyz/anchor avm --locked --force
          avm install 0.32.1
          avm use 0.32.1
      - name: anchor test
        if: steps.mudou.outputs.sim == 'true'
        run: |
          npm ci
          solana-keygen new --no-bip39-passphrase -s -o ~/.config/solana/id.json
          # target/ nao e versionado, entao o CI gera um keypair de programa novo
          # a cada execucao e ele nunca bate com o declare_id! do repositorio.
          # Sem este sync o anchor test falha em DeclaredProgramIdMismatch, e o
          # erro nao tem nada a ver com o que o commit mudou.
          anchor keys sync || (anchor build && anchor keys sync)
          anchor test

  e2e:
    name: navegador
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: fluxo completo no navegador
        run: npm run test:e2e
      - name: auditoria de acessibilidade
        run: npm run test:a11y
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas-e-acessibilidade
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  artefato:
    name: artefato
    runs-on: ubuntu-latest
    needs: [lint, test, postgres, driver-anchor]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev
      # Prova que um clone limpo sobe: o criterio 1 da secao 13 do brief.
      - name: clone limpo sobe e responde
        run: npm run build:artifact
      - uses: actions/upload-artifact@v4
        with:
          name: uniwork
          path: .artifacts/
          retention-days: 14
