<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Uni.work · trampos curtos para universitários</title>
<meta name="description" content="Trampos curtos para universitários. O contratante reserva o valor antes de você começar, e cada trabalho concluído vira um certificado que ninguém consegue falsificar.">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="/favicon.png" sizes="256x256">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400..700&family=Nunito:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<!-- Sincrono e antes do CSS: aplica o tema salvo antes da primeira pintura.
     Arquivo separado porque a politica de seguranca da pagina nao permite
     script escrito dentro do HTML. -->
<script src="/tema.js"></script>
<style>
/* ─── tokens ─────────────────────────────────────────────────────────────────
   Claro e o padrao. Escuro entra por prefers-color-scheme na primeira visita e
   por data-tema="escuro" no <html> quando a pessoa escolhe no botao da barra.
   Nenhuma cor e declarada so dentro de um dos dois blocos: as duas listas tem
   exatamente as mesmas chaves. */
:root{
  --bg:#EEF1E7;
  --lateral:#F6F8F1;
  --card:#FFFFFF;
  --card-2:#F6F8F1;
  --card-3:#EAEFE1;
  --line:#DCE3D3;
  --line-2:#C7D2B9;

  --ink:#13231A;
  --ink-2:#55675C;
  --ink-3:#626E66;
  --ink-4:#6B7C71;

  --verde:#12B866;
  --laranja:#FFC93C;
  --roxo:#6B5BFF;
  --azul:#6B5BFF;
  --vermelho:#FF6F4E;

  --r-sm:10px; --r-md:16px; --r-lg:22px; --r-xl:30px;

  /* Derivados: cada acento precisa de tres papeis, e usar a cor cheia nos tres
     reprova em contraste. -txt e para texto, -base e a borda inferior solida do
     botao, -suave e fundo de etiqueta e de painel. */
  --verde-txt:#0A7C45; --verde-base:#0A8C4C; --verde-suave:#DDF3E5;
  --laranja-txt:#7A5600; --laranja-base:#D9A200; --laranja-suave:#FFF1CC;
  --roxo-txt:#4534D6; --roxo-base:#4534D6; --roxo-suave:#E9E6FF;
  --vermelho-txt:#A83B1F; --vermelho-suave:#FFE6DF;
  --azul-forte:#4534D6; --azul-2:#4534D6; --roxo-2:#4534D6;

  /* O texto do botao principal e escuro de proposito: branco sobre o verde vivo
     fica em 2,6:1 e reprova em acessibilidade. */
  --btn-ink:#0A1B12;
  --btn-ink-dinheiro:#241A00;

  --orbe-1:#FFFFFF; --orbe-2:#EAEFE1; --orbe-3:#DCE3D3; --orbe-sombra:.10;

  /* Tintas de capa de cartao, estaveis por categoria. */
  --t0:#EFE9FF; --t1:#E4F0FF; --t2:#DFF4E8; --t3:#FFE8F1; --t4:#FFF3D9;

  --sombra:0 22px 44px -28px rgba(16,40,28,.55);

  --sans:'Nunito',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --display:'Fredoka','Trebuchet MS',system-ui,sans-serif;
  --mono:'DM Mono',ui-monospace,Consolas,monospace;

  --esq:245px;
  --dir:300px;
}

@media (prefers-color-scheme: dark){
  :root:not([data-tema="claro"]){
    --bg:#0C1611;
    --lateral:#182821;
    --card:#13201A;
    --card-2:#182821;
    --card-3:#1E3128;
    --line:#23372C;
    --line-2:#2F4A3B;

    --ink:#E9F2EC;
    --ink-2:#A2B7A9;
    --ink-3:#8BA195;
    --ink-4:#93A99A;

    --verde:#2FE083;
    --laranja:#FFCF52;
    --roxo:#9A8CFF;
    --azul:#9A8CFF;
    --vermelho:#FF8A6B;

    --verde-txt:#63EDA5; --verde-base:#159A5B; --verde-suave:#123626;
    --laranja-txt:#FFD980; --laranja-base:#C99400; --laranja-suave:#382C0F;
    --roxo-txt:#BCB2FF; --roxo-base:#5B4ACC; --roxo-suave:#241F47;
    --vermelho-txt:#FFAA92; --vermelho-suave:#3A1D14;
    --azul-forte:#5B4ACC; --azul-2:#BCB2FF; --roxo-2:#BCB2FF;

    --orbe-1:#1E3128; --orbe-2:#182821; --orbe-3:#0C1611; --orbe-sombra:.5;

    --t0:#241F47; --t1:#152A40; --t2:#123626; --t3:#3A1D2B; --t4:#382C0F;

    --sombra:0 22px 44px -26px rgba(0,0,0,.75);
  }
}

[data-tema="escuro"]{
  --bg:#0C1611;
  --lateral:#182821;
  --card:#13201A;
  --card-2:#182821;
  --card-3:#1E3128;
  --line:#23372C;
  --line-2:#2F4A3B;

  --ink:#E9F2EC;
  --ink-2:#A2B7A9;
  --ink-3:#8BA195;
  --ink-4:#93A99A;

  --verde:#2FE083;
  --laranja:#FFCF52;
  --roxo:#9A8CFF;
  --azul:#9A8CFF;
  --vermelho:#FF8A6B;

  --verde-txt:#63EDA5; --verde-base:#159A5B; --verde-suave:#123626;
  --laranja-txt:#FFD980; --laranja-base:#C99400; --laranja-suave:#382C0F;
  --roxo-txt:#BCB2FF; --roxo-base:#5B4ACC; --roxo-suave:#241F47;
  --vermelho-txt:#FFAA92; --vermelho-suave:#3A1D14;
  --azul-forte:#5B4ACC; --azul-2:#BCB2FF; --roxo-2:#BCB2FF;

  --orbe-1:#1E3128; --orbe-2:#182821; --orbe-3:#0C1611; --orbe-sombra:.5;

  --t0:#241F47; --t1:#152A40; --t2:#123626; --t3:#3A1D2B; --t4:#382C0F;

  --sombra:0 22px 44px -26px rgba(0,0,0,.75);
}

/* ─── base ──────────────────────────────────────────────────────────────────*/
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:var(--sans);font-size:14.5px;line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{margin:0;font-family:var(--display);font-weight:600;line-height:1.15;letter-spacing:-.018em}
p{margin:0}
button,input,textarea,select{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--roxo);outline-offset:2px;border-radius:6px}
::selection{background:var(--verde-suave)}
/* A monoespacada fica so onde o caractere exato importa: codigo de certificado,
   hash, endereco de conta e nome da rede. */
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
/* O atributo hidden perde para qualquer display declarado depois. Sem esta
   linha, esconder um elemento por hidden nao esconde nada. */
[hidden]{display:none!important}
.dados{margin:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.pular{
  position:absolute;left:12px;top:-60px;z-index:100;
  padding:10px 18px;border-radius:0 0 var(--r-md) var(--r-md);
  background:var(--ink);color:var(--bg);font-weight:700;transition:top .15s;
}
.pular:focus{top:0}

/* ─── marca ─────────────────────────────────────────────────────────────────*/
/* A marca e uma imagem, mas entra como mascara: assim ela toma a cor do tema em
   vez de trazer o branco cravado do arquivo. */
.marca{display:flex;align-items:center}
.marca-imagem{
  display:block;width:161px;height:29px;flex:none;background:var(--ink);
  -webkit-mask:url('/marca') left center/contain no-repeat;
          mask:url('/marca') left center/contain no-repeat;
}

/* ─── esqueleto ─────────────────────────────────────────────────────────────*/
.app{display:none;min-height:100dvh}
.app.ativo{display:grid;grid-template-columns:var(--esq) minmax(0,1fr) var(--dir)}

.esq{
  position:sticky;top:0;height:100dvh;overflow-y:auto;
  background:var(--lateral);border-right:1px solid var(--line);
  display:flex;flex-direction:column;padding:20px 12px 16px;
}
.esq::-webkit-scrollbar{width:0}
.esq .marca{padding:0 8px 22px}

.nav{display:flex;flex-direction:column;gap:3px}
.nav-grupo{
  margin:18px 0 6px;padding:0 10px;
  font-size:10.5px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);
}
.nav-item{
  display:flex;align-items:center;gap:11px;width:100%;
  padding:10px;border:0;border-radius:13px;
  background:none;cursor:pointer;text-align:left;
  color:var(--ink-2);font-size:14.5px;font-weight:700;
  transition:background .13s,color .13s;
}
.nav-item:hover{background:var(--card-3);color:var(--ink)}
.nav-item[aria-current="page"]{background:var(--verde-suave);color:var(--verde-txt)}
.nav-glifo{width:18px;height:18px;flex:none;opacity:.9}
.nav-conta{
  margin-left:auto;font-size:11.5px;font-weight:800;font-variant-numeric:tabular-nums;
  background:var(--line);color:var(--ink-2);border-radius:999px;padding:1px 8px;
}
.nav-item[aria-current="page"] .nav-conta{background:var(--verde);color:var(--btn-ink)}
/* O contador de avisos nao lidos. A classe e .alerta, e nao .aviso, porque
   .aviso ja e o cartao de recado que aparece no canto da tela: reaproveitar o
   nome trazia o estilo do cartao para dentro do item de menu. */
.nav-item.alerta .nav-conta{background:var(--vermelho);color:#2A0C04}

/* cartao de quem esta logado, no rodape do menu */
.esq-rodape{margin-top:auto;padding-top:18px}
.eu{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:13px}
.eu-topo{display:flex;align-items:center;gap:10px;margin-bottom:11px}
.eu-nome{font-family:var(--display);font-weight:600;font-size:14.5px;line-height:1.2;display:block}
.eu-sub{font-size:12px;color:var(--ink-3);display:block}
.eu p{font-size:12px;color:var(--ink-2);margin-top:8px}
.eu p b{color:var(--ink)}
.barra-selo{height:8px;border-radius:999px;background:var(--line);overflow:hidden}
.barra-selo i{display:block;height:100%;background:var(--verde);border-radius:999px}
.esq-cta{margin-top:11px}
.esq-vivo{
  display:flex;align-items:center;gap:7px;margin:12px 4px 0;
  font-family:var(--mono);font-size:11px;color:var(--ink-3);
}
.ponto-vivo{width:6px;height:6px;border-radius:50%;background:var(--verde);flex:none}
@media (prefers-reduced-motion:no-preference){
  .ponto-vivo{animation:pulsar 2.4s ease-in-out infinite}
  @keyframes pulsar{0%,100%{opacity:1}50%{opacity:.3}}
}
.esq-link{
  display:block;width:100%;padding:4px;border:0;background:none;
  text-align:left;font:inherit;font-size:12.5px;font-weight:700;color:var(--ink-3);cursor:pointer;
}
.esq-link:hover{color:var(--ink-2)}

.centro{min-width:0;display:flex;flex-direction:column}
.topo{
  position:sticky;top:0;z-index:30;
  display:flex;align-items:center;gap:12px;
  padding:13px 22px;background:var(--bg);border-bottom:1px solid var(--line);
}
.busca{position:relative;flex:1;max-width:400px}
.busca input{
  width:100%;padding:9px 40px 9px 38px;
  background:var(--card-2);border:1px solid var(--line);border-radius:999px;
  font-size:13.5px;transition:border-color .14s;
}
.busca input::placeholder{color:var(--ink-3)}
.busca input:focus{border-color:var(--verde);outline:none}
.busca-lupa{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--ink-3);pointer-events:none}
.busca kbd{
  position:absolute;right:11px;top:50%;transform:translateY(-50%);
  padding:2px 7px;border-radius:5px;background:var(--card-3);border:1px solid var(--line-2);
  font-family:var(--mono);font-size:11px;color:var(--ink-3);pointer-events:none;
}
.topo-acoes{margin-left:auto;display:flex;align-items:center;gap:9px}

/* alternador de tema: mora entre a busca e o perfil */
.tema{
  display:flex;align-items:center;gap:7px;
  border:1px solid var(--line-2);background:var(--card-2);border-radius:999px;
  padding:7px 13px;font-size:12.5px;font-weight:800;color:var(--ink-2);cursor:pointer;
}
.tema:hover{color:var(--ink);border-color:var(--verde)}
.tema svg{width:15px;height:15px}

.conteudo{padding:20px 22px 60px;display:flex;flex-direction:column;gap:20px;min-width:0}
.conteudo:focus{outline:none}

.dir{
  position:sticky;top:0;height:100dvh;overflow-y:auto;
  background:var(--lateral);border-left:1px solid var(--line);
  padding:18px 16px 40px;display:flex;flex-direction:column;gap:13px;
}
.dir::-webkit-scrollbar{width:4px}
.dir::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:2px}
#dir-widgets{display:flex;flex-direction:column;gap:13px}

/* ─── cartoes da barra da direita ───────────────────────────────────────────*/
.widget{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:15px}
.widget-topo{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.widget-topo h3{font-size:14.5px;flex:1;display:flex;align-items:center;gap:7px}
.widget-topo h3 svg{width:15px;height:15px;color:var(--verde-txt);flex:none}
.widget-selo{font-size:11.5px;font-weight:800;color:var(--laranja-txt)}
.widget-selo.vivo{display:flex;align-items:center;gap:6px;color:var(--ink-3);font-weight:700}
.widget p{font-size:12.5px;color:var(--ink-2);line-height:1.6}

.linha{
  display:flex;justify-content:space-between;align-items:baseline;gap:12px;
  font-size:13px;padding:7px 0;border-bottom:1px dashed var(--line);
}
.linha:last-of-type{border-bottom:0}
.linha span{color:var(--ink-2)}
.linha b{font-family:var(--display);font-weight:600;font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.linha b small{display:block;font-family:var(--sans);font-size:11px;font-weight:700;color:var(--ink-3)}
.linha.destaque b{color:var(--verde-txt)}

.mini-passo{display:grid;grid-template-columns:20px 1fr;gap:10px;align-items:start;padding:6px 0}
.mini-passo .n{
  width:20px;height:20px;border-radius:50%;background:var(--verde-suave);color:var(--verde-txt);
  display:grid;place-items:center;font-family:var(--mono);font-size:10px;font-weight:500;
}
.mini-passo b{display:block;font-size:13px;font-weight:800}
.mini-passo p{font-size:12.5px;color:var(--ink-2)}

/* ─── gaveta tecnica ────────────────────────────────────────────────────────*/
/* Fechada por padrao, no fim da barra da direita. */
.tec{background:var(--card-2);border:1px solid var(--line);border-radius:var(--r-md);padding:11px 13px;margin-top:auto}
.tec summary{
  cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;
  font-size:11.5px;font-weight:800;letter-spacing:.06em;color:var(--ink-3);
}
.tec summary::-webkit-details-marker{display:none}
.tec summary svg{width:12px;height:12px;flex:none;transition:transform .18s}
.tec[open] summary svg{transform:rotate(180deg)}
.tec-resumo{margin-left:auto;font-weight:500;letter-spacing:0;font-family:var(--mono);font-size:10.5px;text-align:right}
.gaveta-conteudo{margin-top:10px;max-height:min(52dvh,420px);overflow-y:auto;font-family:var(--mono);font-size:11px}
.gaveta-linha{padding:9px 0;border-top:1px solid var(--line);display:grid;gap:4px}
.gaveta-tipo{color:var(--roxo-txt);font-weight:500}
.gaveta-dado{color:var(--ink-3);word-break:break-all;line-height:1.7}
.gaveta-dado b{color:var(--ink-2);font-weight:500}
.gaveta-link{color:var(--roxo-txt);font-weight:500}
.gaveta-link:hover{text-decoration:underline}
.gaveta-vazia{padding:14px 0;color:var(--ink-3);text-align:center}

/* ─── heroi ─────────────────────────────────────────────────────────────────*/
.heroi{
  position:relative;overflow:hidden;border-radius:var(--r-lg);
  border:1px solid var(--line);background:var(--card-2);padding:26px 28px;min-height:170px;
  display:flex;flex-direction:column;justify-content:center;
}
.heroi.verde{background:var(--verde-suave);border-color:var(--verde)}
.heroi.azul,.heroi.roxo{background:var(--roxo-suave);border-color:var(--roxo)}
.heroi.grafite{background:var(--card-2);border-color:var(--line-2)}
.heroi > *{position:relative;z-index:1}
.heroi-olho{font-size:12.5px;font-weight:700;color:var(--ink-2);margin-bottom:11px}
.heroi h1{font-size:32px;max-width:20ch;letter-spacing:-.022em}
.heroi p{font-size:14.5px;color:var(--ink-2);max-width:56ch;margin-top:11px;line-height:1.6}
.heroi-dados{display:flex;gap:30px;margin-top:20px;flex-wrap:wrap}
/* Sobre a tinta do heroi, --ink-3 fica em 4,37:1 e reprova. Aqui o rotulo usa
   --ink-2, que passa em qualquer um dos fundos tingidos. */
.heroi-dado span{display:block;font-size:11.5px;font-weight:700;color:var(--ink-2);margin-bottom:2px}
.heroi-dado strong{font-family:var(--display);font-weight:600;font-size:17px}
.heroi-arte{position:absolute;right:28px;top:50%;transform:translateY(-50%);width:180px;height:180px;z-index:0;pointer-events:none}
.heroi-glifo{
  position:absolute;left:50%;top:43%;transform:translate(-50%,-50%);
  font-size:30px;line-height:1;
  font-family:'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',var(--sans);
}
.heroi-acoes{display:flex;gap:9px;margin-top:20px;flex-wrap:wrap}

/* ─── botoes ────────────────────────────────────────────────────────────────*/
/* Todo botao tem base solida embaixo e afunda 3px no clique. E o gesto que faz
   a interface responder ao toque sem depender de animacao. */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:11px 19px;border-radius:14px;border:0;
  font-family:var(--display);font-size:15px;font-weight:600;
  cursor:pointer;white-space:nowrap;
  transition:transform .1s ease,box-shadow .1s ease,background .14s;
}
.btn svg{width:17px;height:17px}
.btn:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}
.btn-primario{background:var(--verde);color:var(--btn-ink);box-shadow:0 4px 0 var(--verde-base)}
.btn-primario:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 5px 0 var(--verde-base)}
.btn-primario:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--verde-base)}
.btn-dinheiro{background:var(--laranja);color:var(--btn-ink-dinheiro);box-shadow:0 4px 0 var(--laranja-base)}
.btn-dinheiro:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 5px 0 var(--laranja-base)}
.btn-dinheiro:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--laranja-base)}
.btn-linha{background:var(--card);color:var(--ink);border:2px solid var(--line-2);box-shadow:0 4px 0 var(--line-2)}
.btn-linha:hover:not(:disabled){transform:translateY(-1px);border-color:var(--verde)}
.btn-linha:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--line-2)}
.btn-claro{background:var(--ink);color:var(--bg);box-shadow:0 4px 0 var(--ink-4)}
.btn-claro:hover:not(:disabled){transform:translateY(-1px)}
.btn-claro:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--ink-4)}
.btn-fantasma{background:none;color:var(--ink-2)}
.btn-fantasma:hover:not(:disabled){background:var(--card-3);color:var(--ink)}
.btn-perigo{background:var(--vermelho-suave);color:var(--vermelho-txt);box-shadow:0 4px 0 var(--vermelho)}
.btn-perigo:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--vermelho)}
.btn-bloco{width:100%}
.btn-mini{padding:8px 14px;font-size:13.5px;border-radius:11px}

/* ─── cartao de vaga ────────────────────────────────────────────────────────*/
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(256px,1fr));gap:14px}
.vaga{
  position:relative;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r-md);cursor:pointer;text-align:left;
  width:100%;font:inherit;color:inherit;padding:0;display:flex;flex-direction:column;
  transition:border-color .16s,transform .16s;
}
.vaga:hover{border-color:var(--verde);transform:translateY(-2px)}
/* Sem overflow:hidden aqui: o selo avanca sobre a borda de proposito, e quem
   arredonda os cantos e o cartao. */
.vaga-capa{position:relative;padding:16px 16px 26px;border-bottom:1px solid var(--line);border-radius:var(--r-md) var(--r-md) 0 0}
.vaga-capa.c0{background:var(--t0)} .vaga-capa.c1{background:var(--t1)}
.vaga-capa.c2{background:var(--t2)} .vaga-capa.c3{background:var(--t3)}
.vaga-capa.c4{background:var(--t4)}
.vaga-valor{font-family:var(--display);font-weight:600;font-size:25px;letter-spacing:-.022em;line-height:1;font-variant-numeric:tabular-nums}
.vaga-valor small{display:block;font-family:var(--sans);font-size:11.5px;font-weight:700;color:var(--ink-3);letter-spacing:0;margin-top:4px}
.vaga-modo{
  position:absolute;top:14px;right:14px;padding:4px 11px;border-radius:999px;
  font-size:11.5px;font-weight:800;background:var(--card);
  border:1px solid var(--line);color:var(--ink-2);
}
.vaga-selo{
  position:absolute;right:14px;bottom:-18px;width:38px;height:38px;border-radius:12px;
  display:grid;place-items:center;font-size:17px;
  background:var(--card);border:1px solid var(--line);z-index:2;
}
.vaga-corpo{padding:16px;display:flex;flex-direction:column;gap:10px;flex:1}
.vaga-titulo{font-family:var(--display);font-weight:600;font-size:15.5px;line-height:1.28}
.vaga-desc{font-size:12.5px;color:var(--ink-3);line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vaga-rodape{display:flex;align-items:center;gap:8px;margin-top:auto;padding-top:10px;border-top:1px solid var(--line);font-size:12.5px;font-weight:700;color:var(--ink-2)}

/* trilha das seis etapas, com o rotulo do estado atual embaixo */
.trilha{display:flex;align-items:center;gap:5px}
.trilha-seg{height:5px;flex:1;border-radius:999px;background:var(--line)}
.trilha-seg.feito{background:var(--verde)}
.trilha-seg.atual{background:var(--laranja)}
.trilha-seg.cancelado{background:var(--vermelho)}
.passo-nome{font-size:11.5px;font-weight:800;color:var(--ink-3)}
.passo-nome.alerta{color:var(--laranja-txt)}

.etiquetas{display:flex;gap:6px;flex-wrap:wrap}
.etiqueta{
  display:inline-flex;align-items:center;gap:6px;
  font-size:11.5px;font-weight:800;padding:4px 10px;border-radius:999px;
  background:var(--card-2);border:1px solid var(--line);color:var(--ink-2);
}
.etiqueta svg{width:12px;height:12px}
.etiqueta.verde{background:var(--verde-suave);color:var(--verde-txt);border-color:transparent}
.etiqueta.laranja{background:var(--laranja-suave);color:var(--laranja-txt);border-color:transparent}
.etiqueta.roxa{background:var(--roxo-suave);color:var(--roxo-txt);border-color:transparent}
.etiqueta.coral{background:var(--vermelho-suave);color:var(--vermelho-txt);border-color:transparent}

.avatar{
  width:22px;height:22px;flex:none;border-radius:7px;display:grid;place-items:center;
  font-family:var(--display);font-size:10px;font-weight:600;color:#161616;background:var(--verde);
}
.avatar.g{width:38px;height:38px;border-radius:12px;font-size:14px}
.avatar.gg{width:56px;height:56px;border-radius:16px;font-size:19px}
.avatar.c0{background:#C7B3FF} .avatar.c1{background:#7FD1F5}
.avatar.c2{background:#8FE3B4} .avatar.c3{background:#FF8A5B}
.avatar.c4{background:#FFD166}

/* ─── paineis ───────────────────────────────────────────────────────────────*/
.painel{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:17px}
/* Linha de dado dentro de painel: rotulo a esquerda, valor a direita, na mesma
   régua da barra da direita. Sem esta regra o <dt>/<dd> volta ao empilhamento
   padrao do navegador, com o valor indentado embaixo do rotulo. */
.linha-dado{
  display:flex;align-items:baseline;justify-content:space-between;gap:12px;
  padding:7px 0;border-bottom:1px dashed var(--line);font-size:13px;
}
.linha-dado:last-child{border-bottom:0}
.linha-dado dt{color:var(--ink-2)}
.linha-dado dd{
  margin:0;font-family:var(--display);font-weight:600;font-size:14.5px;
  font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap;
}

/* ─── barras por categoria ──────────────────────────────────────────────────
   Uma serie so (quantas vagas abertas por categoria), entao uma cor so: hue
   categorica aqui seria decoracao, nao informacao. O tom e --verde-base porque
   --verde cheio fica em 2,53:1 contra o cartao e nao se sustenta como marca
   grafica; este passa de 3:1 nos dois temas. A barra e proporcional a maior
   categoria, e o numero aparece sempre — a leitura nunca depende da cor. */
/* Largura limitada: barra que atravessa o cartao inteiro le como regua, e
   nao como grafico. */
.cats{display:flex;flex-direction:column;max-width:560px}
.cat{
  /* Coluna do rotulo com largura fixa: cada linha e um grid proprio, entao
     minmax(auto) faria a barra comecar num lugar diferente em cada linha. */
  display:grid;grid-template-columns:120px minmax(0,1fr) 3ch;
  align-items:center;gap:12px;padding:7px 0;border-radius:8px;
}
.cat:hover{background:var(--card-2)}
.cat-nome{font-size:13px;font-weight:700;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat-trilho{height:8px;border-radius:0 4px 4px 0;background:var(--card-3);overflow:hidden}
.cat-barra{display:block;height:100%;background:var(--verde-base);border-radius:0 4px 4px 0}
.cat-total{
  font-family:var(--display);font-weight:600;font-size:14.5px;
  font-variant-numeric:tabular-nums;min-width:2ch;text-align:right;
}
@media (max-width:640px){
  .cat{grid-template-columns:minmax(0,1fr) auto;gap:8px}
  .cat-trilho{grid-column:1 / -1;order:3}
}
.painel h4{font-size:14px;letter-spacing:0;color:var(--ink);margin-bottom:12px;display:flex;align-items:center;gap:7px}
.painel h4 svg{width:15px;height:15px;color:var(--verde-txt);flex:none}
.secao{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.secao h2{font-size:19px}
.secao .conta{font-size:12.5px;font-weight:800;color:var(--ink-3)}
.filtros{display:flex;gap:7px;flex-wrap:wrap;margin-left:auto;align-items:center}
.aba{
  padding:6px 14px;border-radius:999px;cursor:pointer;font-size:13px;font-weight:700;
  background:var(--card);border:1px solid var(--line-2);color:var(--ink-2);transition:all .13s;
}
.aba:hover{color:var(--ink);border-color:var(--verde)}
.aba[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.campo-filtro{padding:8px 13px;background:var(--card);border:1px solid var(--line-2);border-radius:var(--r-sm);font-size:13px;min-width:190px}
.campo-filtro::placeholder{color:var(--ink-3)}
.campo-filtro:focus{border-color:var(--verde);outline:none}

.entrar-grade{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.pessoa{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  padding:11px 13px;margin-bottom:8px;border-radius:13px;
  background:var(--card-2);border:1px solid var(--line);cursor:pointer;
  font:inherit;color:inherit;transition:border-color .14s,background .14s;
}
.pessoa:last-child{margin-bottom:0}
.pessoa:hover{border-color:var(--verde);background:var(--card-3)}
.pessoa-nome{font-family:var(--display);font-weight:600;font-size:14px;display:block}
.pessoa-sub{font-size:12px;color:var(--ink-3);margin-top:1px;display:block}
.pessoa .btn{margin-left:auto}

/* ─── fila de decisoes ──────────────────────────────────────────────────────*/
.fila{display:flex;flex-direction:column;gap:10px}
.acao{
  display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:13px;align-items:center;
  background:var(--card);border:1px solid var(--line);border-left:4px solid var(--laranja);
  border-radius:var(--r-md);padding:13px 15px;
}
.acao.pronto{border-left-color:var(--verde)}
.acao-ico{width:36px;height:36px;border-radius:12px;background:var(--laranja-suave);color:var(--laranja-txt);display:grid;place-items:center;flex:none}
.acao.pronto .acao-ico{background:var(--verde-suave);color:var(--verde-txt)}
.acao-ico svg{width:18px;height:18px}
.acao h4{font-size:15px;margin:0}
.acao p{font-size:13px;color:var(--ink-2);margin-top:2px}
.acao-bts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}

.vazio{
  display:flex;flex-direction:column;align-items:center;gap:9px;padding:44px 26px;text-align:center;
  background:var(--card);border:1px dashed var(--line-2);border-radius:var(--r-md);
}
.vazio-ico{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:18px;background:var(--card-3);border:1px solid var(--line-2)}
.vazio h3{font-size:16px}
.vazio p{font-size:13.5px;color:var(--ink-2);max-width:46ch;line-height:1.6}

/* ─── formularios ───────────────────────────────────────────────────────────*/
.campo{display:flex;flex-direction:column;gap:6px;margin-bottom:15px}
.campo label{font-size:12.5px;font-weight:800;color:var(--ink-2)}
.campo .dica{font-size:11.5px;color:var(--ink-3)}
.campo input,.campo textarea,.campo select{
  padding:10px 13px;background:var(--card-2);border:1px solid var(--line-2);
  border-radius:var(--r-sm);width:100%;transition:border-color .14s;font-size:13.5px;
}
.campo input:focus,.campo textarea:focus,.campo select:focus{border-color:var(--verde);outline:none}
.campo textarea{resize:vertical;min-height:96px;font-family:inherit}
.linha-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.escolha{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.escolha button{padding:13px;border-radius:13px;cursor:pointer;text-align:left;background:var(--card-2);border:1px solid var(--line-2);color:var(--ink-2);transition:all .14s}
.escolha button:hover{border-color:var(--verde)}
.escolha button[aria-pressed="true"]{border-color:var(--verde);background:var(--verde-suave);color:var(--ink)}
.escolha strong{display:block;font-family:var(--display);font-weight:600;font-size:13.5px;margin-bottom:2px;color:var(--ink)}
.escolha span{font-size:12px;color:var(--ink-3)}

.codigo-caixa{display:flex;gap:10px;align-items:center;max-width:520px}
.codigo-caixa input{
  flex:1;padding:12px 16px;background:var(--card-2);border:1px solid var(--line-2);
  border-radius:var(--r-sm);font-family:var(--mono);font-size:15px;letter-spacing:.09em;
}
.codigo-caixa input::placeholder{color:var(--ink-3)}
.codigo-caixa input:focus{border-color:var(--verde);outline:none}

/* ─── modal ─────────────────────────────────────────────────────────────────*/
.modal-fundo{position:fixed;inset:0;z-index:80;background:rgba(9,20,14,.62);backdrop-filter:blur(6px);display:grid;place-items:center;padding:22px}
.modal{background:var(--card);border:1px solid var(--line-2);border-radius:var(--r-lg);width:min(600px,100%);max-height:88dvh;overflow-y:auto;box-shadow:var(--sombra)}
.modal-topo{display:flex;align-items:center;gap:12px;padding:18px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card);z-index:1}
.modal-topo h2{font-size:18px;flex:1}
.modal-corpo{padding:22px}
.modal-rodape{display:flex;gap:10px;justify-content:flex-end;padding:15px 22px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--card);flex-wrap:wrap}
.fechar{width:32px;height:32px;border-radius:10px;border:1px solid var(--line-2);background:var(--card-2);cursor:pointer;color:var(--ink-3);display:grid;place-items:center}
.fechar:hover{color:var(--ink)}

/* ─── onboarding ────────────────────────────────────────────────────────────*/
.guia{position:fixed;inset:0;z-index:85;background:rgba(9,20,14,.74);backdrop-filter:blur(8px);display:grid;place-items:center;padding:22px}
.guia-cartao{background:var(--card);border:1px solid var(--line-2);border-radius:var(--r-lg);width:min(540px,100%);overflow:hidden;box-shadow:var(--sombra)}
.guia-arte{height:118px;display:grid;place-items:center;font-size:40px;border-bottom:1px solid var(--line);background:var(--verde-suave)}
.guia-corpo{padding:24px}
.guia-corpo h2{font-size:22px;margin-bottom:9px}
.guia-corpo p{font-size:14.5px;color:var(--ink-2);line-height:1.65}
.guia-rodape{display:flex;align-items:center;gap:12px;padding:15px 24px;border-top:1px solid var(--line)}
.guia-pontos{display:flex;gap:6px}
.guia-ponto{width:6px;height:6px;border-radius:50%;background:var(--line-2)}
.guia-ponto.atual{background:var(--verde);width:20px;border-radius:3px}

/* ─── avisos ────────────────────────────────────────────────────────────────*/
.avisos{position:fixed;bottom:20px;right:20px;z-index:90;display:flex;flex-direction:column;gap:9px;max-width:370px}
.aviso{display:flex;gap:11px;align-items:flex-start;padding:13px 15px;border-radius:var(--r-md);background:var(--card);border:1px solid var(--line-2);box-shadow:var(--sombra);font-size:13.5px}
.aviso.ok{border-color:var(--verde)} .aviso.ok .aviso-ico{color:var(--verde-txt)}
.aviso.erro{border-color:var(--vermelho)} .aviso.erro .aviso-ico{color:var(--vermelho-txt)}
.aviso.info .aviso-ico{color:var(--roxo-txt)}
.aviso-ico{flex:none;font-weight:800}
.aviso strong{display:block;font-family:var(--display);font-weight:600;margin-bottom:1px}
.aviso p{color:var(--ink-2);font-size:12.5px}
@media (prefers-reduced-motion:no-preference){
  .aviso{animation:subir .26s ease}
  @keyframes subir{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
}

.faixa-offline{
  position:fixed;top:0;left:0;right:0;z-index:95;display:none;
  align-items:center;justify-content:center;gap:9px;
  padding:9px 16px;background:var(--vermelho);color:#2A0C04;font-weight:800;font-size:13px;
}
.faixa-offline.ativa{display:flex}

/* ─── detalhe ───────────────────────────────────────────────────────────────*/
.detalhe-grade{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:16px}
.etapas{display:flex;flex-direction:column}
.etapa{display:flex;gap:12px;padding-bottom:15px;position:relative}
.etapa:not(:last-child)::before{content:'';position:absolute;left:9px;top:21px;bottom:0;width:2px;background:var(--line)}
.etapa.feita:not(:last-child)::before{background:var(--verde)}
.etapa-bola{width:20px;height:20px;flex:none;border-radius:50%;background:var(--card-3);border:2px solid var(--line-2);display:grid;place-items:center;font-size:10px;z-index:1}
.etapa.feita .etapa-bola{background:var(--verde);border-color:var(--verde);color:var(--btn-ink)}
.etapa.atual .etapa-bola{background:var(--laranja);border-color:var(--laranja)}
.etapa-texto{font-size:13.5px;font-weight:800;padding-top:1px}
.etapa:not(.feita):not(.atual) .etapa-texto{color:var(--ink-3);font-weight:700}

.conversa{display:flex;flex-direction:column;gap:9px;max-height:320px;overflow-y:auto;padding:2px}
.balao{max-width:78%;padding:9px 13px;border-radius:14px;font-size:13.5px;line-height:1.45}
.balao.deles{background:var(--card-3);border-bottom-left-radius:4px;align-self:flex-start}
.balao.meu{background:var(--verde-suave);border-bottom-right-radius:4px;align-self:flex-end}
.balao-autor{font-size:11px;color:var(--ink-3);margin-bottom:2px;font-weight:800}
.balao.pendente{opacity:.55}

/* ─── certificados ──────────────────────────────────────────────────────────*/
.cert-grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.cert{border-radius:var(--r-md);overflow:hidden;border:1px solid var(--line);background:var(--card);cursor:pointer;text-align:left;width:100%;font:inherit;color:inherit;padding:0;transition:border-color .16s,transform .16s;display:block}
.cert:hover{border-color:var(--verde);transform:translateY(-2px)}
.cert img{display:block;width:100%;aspect-ratio:1000/620;object-fit:cover;background:var(--card-2)}
.cert-info{padding:12px 14px;display:flex;align-items:center;gap:11px}
.cert-horas{font-family:var(--display);font-weight:600;font-size:19px;color:var(--roxo-txt)}
.cert-titulo{font-size:13.5px;font-weight:800;line-height:1.3}
.cert-sub{font-size:11.5px;color:var(--ink-3);margin-top:1px}
.cert-estado{margin-left:auto;font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:999px}
.cert-estado.pronto{background:var(--verde-suave);color:var(--verde-txt)}
.cert-estado.processando{background:var(--laranja-suave);color:var(--laranja-txt)}

/* ─── metricas ──────────────────────────────────────────────────────────────*/
.metricas{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.metrica{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:16px}
.metrica-valor{font-family:var(--display);font-weight:600;font-size:25px;line-height:1.1;font-variant-numeric:tabular-nums}
.metrica-rotulo{font-size:12px;color:var(--ink-3);margin-top:4px}

/* ─── verificacao publica ───────────────────────────────────────────────────*/
.verificacao{max-width:900px;margin:0 auto;padding:40px 22px 90px}
.selo{display:inline-flex;align-items:center;gap:9px;padding:8px 16px;border-radius:999px;font-weight:800;font-size:13.5px;margin-bottom:20px}
.selo.valido{background:var(--verde-suave);color:var(--verde-txt)}
.selo.parcial{background:var(--laranja-suave);color:var(--laranja-txt)}
.selo.invalido{background:var(--vermelho-suave);color:var(--vermelho-txt)}

/* ─── responsivo ────────────────────────────────────────────────────────────*/
@media (max-width:1280px){
  /* A barra da direita nao desaparece: ela desce para baixo do conteudo. E onde
     mora "sua grana", que e a informacao mais util da tela. */
  .app.ativo{grid-template-columns:var(--esq) minmax(0,1fr)}
  .dir{grid-column:2;position:static;height:auto;border-left:0;border-top:1px solid var(--line);padding:18px 22px 60px}
  #dir-widgets{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));align-items:start}
  .tec{margin-top:13px}
  .detalhe-grade{grid-template-columns:1fr}
}
@media (max-width:880px){
  .app.ativo{grid-template-columns:1fr}
  .dir{grid-column:1}
  .esq{position:static;height:auto;flex-direction:row;align-items:center;gap:10px;padding:12px 14px;border-right:0;border-bottom:1px solid var(--line);overflow-x:auto}
  .esq .marca{padding:0 10px 0 0}
  /* Sem espaco para o nome: fica so o simbolo. */
  .esq .marca-imagem{
    width:30px;
    -webkit-mask-image:url('/marca/simbolo');
            mask-image:url('/marca/simbolo');
  }
  .nav{flex-direction:row;gap:5px}
  .nav-grupo,.esq-rodape{display:none}
  .nav-item{white-space:nowrap;padding:8px 12px}
  .entrar-grade,.linha-2,.escolha{grid-template-columns:1fr}
  .heroi{padding:22px}
  .heroi h1{font-size:26px}
  .heroi-arte{display:none}
  .topo{padding:12px 14px}
  .conteudo{padding:16px 14px 50px}
  .acao{grid-template-columns:auto minmax(0,1fr)}
  .acao-bts{grid-column:2}
}
</style>
</head>

<div class="faixa-offline" id="faixa-offline" role="status">
  <span aria-hidden="true">⚠</span>
  <span>Sem conexão com o serviço. Suas ações vão esperar aqui até a conexão voltar.</span>
</div>

<div class="app" id="app">
  <aside class="esq">
    <a class="marca" href="#" id="ir-inicio" aria-label="Uni.work, ir para o início">
      <span class="marca-imagem"></span>
    </a>

    <nav class="nav" id="nav" aria-label="Navegação principal"></nav>

    <div class="esq-rodape" id="esq-rodape"></div>
  </aside>

  <div class="centro">
    <header class="topo">
      <div class="busca">
        <svg class="busca-lupa" width="15" height="15" aria-hidden="true"><use href="#i-lupa"></use></svg>
        <label class="sr" for="busca">Buscar trampos</label>
        <input id="busca" type="search" placeholder="Buscar trampo, curso ou campus">
        <kbd aria-hidden="true">/</kbd>
      </div>
      <button class="tema" id="btn-tema" type="button" aria-pressed="false">
        <svg id="ico-tema" aria-hidden="true"><use href="#i-lua"></use></svg>
        <span id="rotulo-tema">Modo escuro</span>
      </button>
      <div class="topo-acoes" id="topo-acoes"></div>
    </header>

    <main class="conteudo" id="conteudo" tabindex="-1"></main>
  </div>

  <aside class="dir" id="dir" aria-label="Sua grana e como funciona">
    <div id="dir-widgets"></div>

    <!-- A camada técnica é a única parte do produto que fala a língua da rede.
         Ela existe para demonstração, fica fechada e é a última coisa da barra.
         data-camada-tecnica marca o limite: o teste de vocabulário ignora tudo
         que estiver dentro dela e só dentro dela. -->
    <details class="tec" id="gaveta" data-camada-tecnica="true">
      <summary id="gaveta-puxador">
        <svg aria-hidden="true"><use href="#i-baixo"></use></svg>
        <span>Camada técnica</span>
        <span class="tec-resumo" id="gaveta-resumo"></span>
      </summary>
      <div class="gaveta-conteudo" id="gaveta-conteudo"></div>
    </details>
  </aside>
</div>

<div id="verificacao" hidden></div>

<div class="avisos" id="avisos" role="status" aria-live="polite"></div>
<div id="modal-raiz"></div>

<script src="/app.js" type="module"></script>
</body>
</html>
