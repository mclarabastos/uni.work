<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Uni.work · trampos curtos para universitarios</title>
<meta name="description" content="Trampos curtos para universitarios. O contratante reserva o valor antes de voce comecar, e cada trabalho concluido vira um certificado que ninguem consegue falsificar.">
<meta name="color-scheme" content="dark">
<link rel="icon" href="/favicon.png" sizes="256x256">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#08090a;
  --lateral:#0b0c0e;
  --card:#101113;
  --card-2:#15171a;
  --card-3:#1a1d21;
  --line:#1b1e22;
  --line-2:#262a30;

  --ink:#f2f3f5;
  --ink-2:#9aa1ab;
  --ink-3:#7e858f;      /* 4.8:1 no fundo mais claro que existe (--card-3) */
  --ink-4:#868d97;      /* 5.5:1 no mesmo fundo, para texto pequeno em barra */

  --azul:#3b82f6;       /* acento: barras, bordas, foco */
  --azul-forte:#2563eb; /* fundo de botao: 5.2:1 com texto branco */
  --azul-2:#60a5fa;
  --laranja:#f59e0b;
  --verde:#22c55e;
  --roxo:#8b5cf6;
  --roxo-2:#a78bfa;     /* 7:1 sobre o cartao, para texto */
  --vermelho:#ef4444;

  --r-sm:8px; --r-md:12px; --r-lg:16px; --r-xl:20px;
  --sombra:0 20px 60px -20px rgba(0,0,0,.95);

  --sans:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Consolas,monospace;

  --esq:245px;
  --dir:300px;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:var(--sans);font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{margin:0;line-height:1.15;letter-spacing:-.022em}
p{margin:0}
button,input,textarea,select{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--azul);outline-offset:2px;border-radius:6px}
::selection{background:rgba(59,130,246,.35)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
/* O atributo hidden perde para qualquer display declarado depois. Sem esta
   linha, esconder um elemento por hidden nao esconde nada. */
[hidden]{display:none!important}
.dados{margin:0}

.pular{
  position:absolute;left:12px;top:-60px;z-index:100;
  padding:10px 18px;border-radius:0 0 var(--r-md) var(--r-md);
  background:var(--ink);color:#000;font-weight:700;transition:top .15s;
}
.pular:focus{top:0}

/* ─── marca ─────────────────────────────────────────────────────────────── */
/* A marca e uma imagem, mas entra como mascara: assim ela toma a cor do tema
   em vez de trazer o branco cravado do arquivo. */
.marca{display:flex;align-items:center}
.marca-imagem{
  display:block;width:161px;height:29px;flex:none;background:var(--ink);
  -webkit-mask:url('/marca') left center/contain no-repeat;
          mask:url('/marca') left center/contain no-repeat;
}

/* ─── esqueleto ─────────────────────────────────────────────────────────── */
.app{display:none;min-height:100dvh}
.app.ativo{display:grid;grid-template-columns:var(--esq) minmax(0,1fr) var(--dir)}

.esq{
  position:sticky;top:0;height:100dvh;overflow-y:auto;
  background:var(--lateral);border-right:1px solid var(--line);
  display:flex;flex-direction:column;padding:22px 14px 18px;
}
.esq::-webkit-scrollbar{width:0}
.esq .marca{padding:0 8px 26px}

.nav{display:flex;flex-direction:column;gap:2px}
.nav-grupo{
  margin:20px 0 7px;padding:0 10px;
  font-size:10.5px;font-weight:700;letter-spacing:.13em;color:var(--ink-3);
}
.nav-item{
  display:flex;align-items:center;gap:11px;width:100%;
  padding:9px 10px;border:0;border-radius:var(--r-md);
  background:none;cursor:pointer;text-align:left;
  color:var(--ink-2);font-size:14px;font-weight:500;
  transition:background .13s,color .13s;
}
.nav-item:hover{background:var(--card-2);color:var(--ink)}
.nav-item[aria-current="page"]{background:var(--card-3);color:var(--ink);font-weight:600}
.nav-glifo{width:14px;flex:none;text-align:center;font-size:11px;color:var(--ink-3)}
.nav-item[aria-current="page"] .nav-glifo{color:var(--azul-2)}
.nav-conta{margin-left:auto;font-size:11px;font-weight:700;color:var(--ink-3);font-family:var(--mono)}

.esq-rodape{margin-top:auto;padding:22px 10px 0;border-top:1px solid var(--line)}
.esq-rodape h4{font-size:13.5px;font-weight:700;margin-bottom:7px}
.esq-rodape p{font-size:12.5px;color:var(--ink-3);line-height:1.55;margin-bottom:14px}
.esq-cta{
  display:flex;align-items:center;gap:9px;width:100%;
  padding:0;border:0;background:none;cursor:pointer;
  font-size:14px;font-weight:700;color:var(--ink);
}
.esq-cta:hover{color:var(--azul-2)}
.esq-cta .faisca{color:var(--laranja)}
.esq-vivo{
  display:flex;align-items:center;gap:7px;margin:14px 0 16px;
  font-family:var(--mono);font-size:11.5px;color:var(--ink-3);
}
.ponto-vivo{width:6px;height:6px;border-radius:50%;background:var(--verde);flex:none}
@media (prefers-reduced-motion:no-preference){
  .ponto-vivo{animation:pulsar 2.4s ease-in-out infinite}
  @keyframes pulsar{0%,100%{opacity:1}50%{opacity:.3}}
}
.esq-link{
  display:block;width:100%;padding:4px 0;border:0;background:none;
  text-align:left;font:inherit;font-size:12.5px;color:var(--ink-3);cursor:pointer;
}
.esq-link:hover{color:var(--ink-2)}

.centro{min-width:0;display:flex;flex-direction:column}
.topo{
  position:sticky;top:0;z-index:30;
  display:flex;align-items:center;gap:14px;
  padding:16px 22px;background:rgba(8,9,10,.86);backdrop-filter:blur(12px);
}
.busca{position:relative;flex:1;max-width:430px}
.busca input{
  width:100%;padding:9px 40px 9px 38px;
  background:var(--card);border:1px solid var(--line-2);border-radius:var(--r-md);
  font-size:13.5px;transition:border-color .14s;
}
.busca input::placeholder{color:var(--ink-3)}
.busca input:focus{border-color:var(--azul);outline:none}
.busca-lupa{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--ink-3);pointer-events:none}
.busca kbd{
  position:absolute;right:10px;top:50%;transform:translateY(-50%);
  padding:2px 7px;border-radius:5px;background:var(--card-3);border:1px solid var(--line-2);
  font-family:var(--mono);font-size:11px;color:var(--ink-3);pointer-events:none;
}
.topo-acoes{margin-left:auto;display:flex;align-items:center;gap:9px}

.conteudo{padding:6px 22px 70px;display:flex;flex-direction:column;gap:22px;min-width:0}
.conteudo:focus{outline:none}

.dir{
  position:sticky;top:0;height:100dvh;overflow-y:auto;
  padding:20px 20px 60px 0;display:flex;flex-direction:column;gap:14px;
}
.dir::-webkit-scrollbar{width:4px}
.dir::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:2px}

.widget{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px}
.widget-topo{display:flex;align-items:center;gap:8px;margin-bottom:13px}
.widget-topo h3{font-size:13.5px;font-weight:700;flex:1}
.widget-selo{font-size:11.5px;font-weight:700;color:var(--laranja)}
.widget-selo.vivo{display:flex;align-items:center;gap:6px;color:var(--ink-3);font-weight:500}
.widget p{font-size:12.5px;color:var(--ink-3);line-height:1.6}

.barra{
  display:flex;align-items:center;gap:8px;padding:9px 11px;
  background:var(--card-2);border:1px solid var(--line);border-radius:var(--r-md);margin-bottom:12px;
}
.barra-trilho{display:flex;gap:3px;flex:1}
.barra-seg{height:4px;flex:1;border-radius:2px;background:var(--line-2)}
.barra-seg.feito{background:var(--azul)}
.barra-num{font-family:var(--mono);font-size:11px;color:var(--ink-4)}

.linha-dado{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0;font-size:13px}
.linha-dado dt{color:var(--ink-3)}
.linha-dado dd{margin:0;font-weight:700;font-family:var(--mono);font-size:13.5px}

.feed-item{display:flex;gap:9px;padding:7px 0}
.feed-ponto{width:6px;height:6px;border-radius:50%;background:var(--azul);flex:none;margin-top:6px}
.feed-texto{font-size:12.5px;color:var(--ink-2);line-height:1.45}
.feed-quando{font-size:11px;color:var(--ink-3);font-family:var(--mono)}

/* ─── heroi ─────────────────────────────────────────────────────────────── */
.heroi{
  position:relative;overflow:hidden;border-radius:var(--r-xl);
  border:1px solid var(--line);padding:28px 30px;min-height:186px;
  display:flex;flex-direction:column;justify-content:center;
}
.heroi::before{content:'';position:absolute;inset:0}
.heroi.verde::before{background:radial-gradient(120% 150% at 76% 42%,#12694a 0%,#0d3d2c 32%,#0a1614 68%,#0a0f10 100%)}
.heroi.azul::before{background:radial-gradient(120% 150% at 76% 42%,#1e4f96 0%,#153567 32%,#0d1526 68%,#0a0e14 100%)}
.heroi.roxo::before{background:radial-gradient(120% 150% at 76% 42%,#4b3a94 0%,#332764 32%,#161327 68%,#0d0c14 100%)}
.heroi.grafite::before{background:radial-gradient(120% 150% at 76% 42%,#2a2f38 0%,#1b1f26 38%,#101317 74%,#0b0d10 100%)}
.heroi > *{position:relative;z-index:1}
.heroi-olho{font-size:12.5px;color:rgba(255,255,255,.62);margin-bottom:12px}
.heroi h1{font-size:35px;font-weight:800;max-width:17ch;letter-spacing:-.03em}
.heroi p{font-size:14px;color:rgba(255,255,255,.72);max-width:54ch;margin-top:12px;line-height:1.6}
.heroi-dados{display:flex;gap:34px;margin-top:22px;flex-wrap:wrap}
.heroi-dado span{display:block;font-size:11.5px;color:rgba(255,255,255,.55);margin-bottom:3px}
.heroi-dado strong{font-size:15px;font-weight:700}
.heroi-arte{position:absolute;right:30px;top:50%;transform:translateY(-50%);width:200px;height:200px;z-index:0;pointer-events:none}
.heroi-glifo{
  position:absolute;left:50%;top:43%;transform:translate(-50%,-50%);
  font-size:30px;line-height:1;
  font-family:'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',var(--sans);
}
.heroi-acoes{display:flex;gap:9px;margin-top:20px;flex-wrap:wrap}

/* ─── botoes ────────────────────────────────────────────────────────────── */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:9px 17px;border-radius:999px;border:1px solid transparent;
  font-size:13.5px;font-weight:700;cursor:pointer;white-space:nowrap;
  transition:filter .14s,background .14s,border-color .14s,transform .1s;
}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-azul{background:var(--azul-forte);color:#fff}
.btn-azul:hover:not(:disabled){background:#1d4ed8}
.btn-linha{background:transparent;border-color:var(--line-2);color:var(--ink)}
.btn-linha:hover:not(:disabled){background:var(--card-2);border-color:#33383f}
.btn-claro{background:var(--ink);color:#000}
.btn-claro:hover:not(:disabled){filter:brightness(.93)}
.btn-fantasma{background:none;color:var(--ink-2)}
.btn-fantasma:hover:not(:disabled){background:var(--card-2);color:var(--ink)}
.btn-perigo{background:rgba(239,68,68,.12);border-color:rgba(239,68,68,.3);color:#f87171}
.btn-perigo:hover:not(:disabled){background:rgba(239,68,68,.2)}
.btn-bloco{width:100%}
.btn-mini{padding:6px 13px;font-size:12.5px}

/* ─── cartao de vaga ────────────────────────────────────────────────────── */
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(256px,1fr));gap:16px}
.vaga{
  position:relative;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r-lg);overflow:hidden;cursor:pointer;text-align:left;
  width:100%;font:inherit;color:inherit;padding:0;display:flex;flex-direction:column;
  transition:border-color .16s,transform .16s;
}
.vaga:hover{border-color:var(--line-2);transform:translateY(-2px)}
/* Sem overflow:hidden aqui: o selo redondo avanca sobre a borda de proposito,
   e quem arredonda os cantos e o cartao. */
.vaga-capa{position:relative;padding:18px 18px 30px;border-bottom:1px solid var(--line)}
.vaga-capa::before{content:'';position:absolute;inset:0}
.vaga-capa.c0::before{background:linear-gradient(150deg,#2c2150 0%,#1b1733 46%,#121319 100%)}
.vaga-capa.c1::before{background:linear-gradient(150deg,#1e3a63 0%,#16273f 46%,#111419 100%)}
.vaga-capa.c2::before{background:linear-gradient(150deg,#123f3a 0%,#122a2a 46%,#111417 100%)}
.vaga-capa.c3::before{background:linear-gradient(150deg,#4a2340 0%,#2c1a2b 46%,#141216 100%)}
.vaga-capa.c4::before{background:linear-gradient(150deg,#3d3320 0%,#2a2417 46%,#151414 100%)}
.vaga-capa > *{position:relative}
.vaga-valor{font-size:26px;font-weight:800;letter-spacing:-.03em}
.vaga-valor small{font-size:12px;font-weight:600;color:rgba(255,255,255,.6);margin-left:5px;letter-spacing:0}
.vaga-modo{
  position:absolute;top:16px;right:16px;padding:3px 11px;border-radius:999px;
  font-size:11.5px;font-weight:600;background:rgba(255,255,255,.1);
  border:1px solid rgba(255,255,255,.14);color:rgba(255,255,255,.85);
}
.vaga-selo{
  position:absolute;right:16px;bottom:-19px;width:38px;height:38px;border-radius:50%;
  display:grid;place-items:center;font-size:17px;
  background:var(--card-3);border:1px solid var(--line-2);z-index:2;
}
.vaga-corpo{padding:18px;display:flex;flex-direction:column;gap:11px;flex:1}
.vaga-titulo{font-size:14.5px;font-weight:700;line-height:1.35}
.vaga-desc{font-size:12.5px;color:var(--ink-3);line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.trilha{display:flex;gap:4px}
.trilha-seg{height:4px;flex:1;border-radius:2px;background:var(--line-2)}
.trilha-seg.feito{background:var(--azul)}
.trilha-seg.cancelado{background:rgba(239,68,68,.45)}
.etiquetas{display:flex;gap:6px;flex-wrap:wrap}
.etiqueta{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:7px;background:var(--card-2);border:1px solid var(--line);color:var(--ink-2)}
.vaga-rodape{display:flex;align-items:center;gap:8px;margin-top:auto;padding-top:4px;font-size:12px;color:var(--ink-3)}

.avatar{
  width:20px;height:20px;flex:none;border-radius:6px;display:grid;place-items:center;
  font-size:9px;font-weight:800;color:#fff;background:var(--azul);
}
.avatar.g{width:34px;height:34px;border-radius:10px;font-size:13px}
.avatar.gg{width:56px;height:56px;border-radius:16px;font-size:19px}
.avatar.c0{background:linear-gradient(135deg,#8b5cf6,#6366f1)}
.avatar.c1{background:linear-gradient(135deg,#3b82f6,#06b6d4)}
.avatar.c2{background:linear-gradient(135deg,#22c55e,#84cc16)}
.avatar.c3{background:linear-gradient(135deg,#ec4899,#f43f5e)}
.avatar.c4{background:linear-gradient(135deg,#f59e0b,#ef4444)}

/* ─── paineis ───────────────────────────────────────────────────────────── */
.painel{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px}
.painel h4{font-size:11px;font-weight:700;letter-spacing:.11em;color:var(--ink-3);margin-bottom:13px}
.secao{display:flex;align-items:center;gap:11px;flex-wrap:wrap}
.secao h2{font-size:17px;font-weight:700}
.secao .conta{font-size:11.5px;font-weight:700;color:var(--ink-3);padding:2px 8px;border-radius:999px;background:var(--card-2);border:1px solid var(--line)}
.filtros{display:flex;gap:7px;flex-wrap:wrap;margin-left:auto;align-items:center}
.aba{padding:6px 15px;border-radius:999px;cursor:pointer;font-size:13px;font-weight:600;background:transparent;border:1px solid transparent;color:var(--ink-3);transition:all .13s}
.aba:hover{color:var(--ink-2)}
.aba[aria-pressed="true"]{background:var(--card-3);border-color:var(--line-2);color:var(--ink)}
.campo-filtro{padding:8px 13px;background:var(--card);border:1px solid var(--line-2);border-radius:var(--r-md);font-size:13px;min-width:190px}
.campo-filtro::placeholder{color:var(--ink-3)}
.campo-filtro:focus{border-color:var(--azul);outline:none}

.entrar-grade{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.pessoa{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  padding:13px 14px;margin-bottom:9px;border-radius:var(--r-md);
  background:var(--card-2);border:1px solid var(--line);cursor:pointer;
  font:inherit;color:inherit;transition:border-color .14s,background .14s;
}
.pessoa:last-child{margin-bottom:0}
.pessoa:hover{border-color:var(--line-2);background:var(--card-3)}
.pessoa-nome{font-size:14px;font-weight:700}
.pessoa-sub{font-size:12px;color:var(--ink-3);margin-top:1px}

.vazio{
  display:flex;flex-direction:column;align-items:center;gap:9px;padding:48px 26px;text-align:center;
  background:var(--card);border:1px dashed var(--line-2);border-radius:var(--r-lg);
}
.vazio-ico{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:18px;background:var(--card-3);border:1px solid var(--line-2)}
.vazio h3{font-size:15px;font-weight:700}
.vazio p{font-size:13px;color:var(--ink-3);max-width:44ch;line-height:1.6}

/* ─── formularios ───────────────────────────────────────────────────────── */
.campo{display:flex;flex-direction:column;gap:6px;margin-bottom:15px}
.campo label{font-size:12.5px;font-weight:700;color:var(--ink-2)}
.campo .dica{font-size:11.5px;color:var(--ink-3)}
.campo input,.campo textarea,.campo select{
  padding:10px 13px;background:var(--card-2);border:1px solid var(--line-2);
  border-radius:var(--r-md);width:100%;transition:border-color .14s;font-size:13.5px;
}
.campo input:focus,.campo textarea:focus,.campo select:focus{border-color:var(--azul);outline:none}
.campo textarea{resize:vertical;min-height:96px;font-family:inherit}
.linha-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.escolha{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.escolha button{padding:13px;border-radius:var(--r-md);cursor:pointer;text-align:left;background:var(--card-2);border:1px solid var(--line-2);color:var(--ink-2);transition:all .14s}
.escolha button:hover{border-color:#33383f}
.escolha button[aria-pressed="true"]{border-color:var(--azul);background:rgba(59,130,246,.1);color:var(--ink)}
.escolha strong{display:block;font-size:13.5px;margin-bottom:2px;color:var(--ink)}
.escolha span{font-size:12px;color:var(--ink-3)}

.codigo-caixa{display:flex;gap:10px;align-items:center;max-width:520px}
.codigo-caixa input{
  flex:1;padding:12px 16px;background:var(--card);border:1px solid var(--line-2);
  border-radius:var(--r-md);font-family:var(--mono);font-size:15px;letter-spacing:.09em;
}
.codigo-caixa input::placeholder{color:var(--ink-3)}
.codigo-caixa input:focus{border-color:var(--azul);outline:none}

/* ─── modal ─────────────────────────────────────────────────────────────── */
.modal-fundo{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.78);backdrop-filter:blur(6px);display:grid;place-items:center;padding:22px}
.modal{background:var(--card);border:1px solid var(--line-2);border-radius:var(--r-xl);width:min(600px,100%);max-height:88dvh;overflow-y:auto;box-shadow:var(--sombra)}
.modal-topo{display:flex;align-items:center;gap:12px;padding:20px 24px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card);z-index:1}
.modal-topo h2{font-size:17px;font-weight:700;flex:1}
.modal-corpo{padding:24px}
.modal-rodape{display:flex;gap:10px;justify-content:flex-end;padding:16px 24px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--card)}
.fechar{width:30px;height:30px;border-radius:9px;border:1px solid var(--line-2);background:var(--card-2);cursor:pointer;color:var(--ink-3);display:grid;place-items:center}
.fechar:hover{color:var(--ink)}

/* ─── onboarding ────────────────────────────────────────────────────────── */
.guia{position:fixed;inset:0;z-index:85;background:rgba(0,0,0,.86);backdrop-filter:blur(8px);display:grid;place-items:center;padding:22px}
.guia-cartao{background:var(--card);border:1px solid var(--line-2);border-radius:var(--r-xl);width:min(540px,100%);overflow:hidden;box-shadow:var(--sombra)}
.guia-arte{position:relative;height:124px;display:grid;place-items:center;font-size:40px;border-bottom:1px solid var(--line);background:radial-gradient(100% 140% at 50% 20%,#1e3a63 0%,#141a26 55%,#101113 100%)}
.guia-corpo{padding:26px}
.guia-corpo h2{font-size:21px;font-weight:800;margin-bottom:9px}
.guia-corpo p{font-size:14px;color:var(--ink-2);line-height:1.65}
.guia-rodape{display:flex;align-items:center;gap:12px;padding:16px 26px;border-top:1px solid var(--line)}
.guia-pontos{display:flex;gap:6px}
.guia-ponto{width:6px;height:6px;border-radius:50%;background:var(--line-2)}
.guia-ponto.atual{background:var(--azul);width:20px;border-radius:3px}

/* ─── avisos ────────────────────────────────────────────────────────────── */
.avisos{position:fixed;bottom:56px;right:20px;z-index:90;display:flex;flex-direction:column;gap:9px;max-width:370px}
.aviso{display:flex;gap:11px;align-items:flex-start;padding:13px 15px;border-radius:var(--r-md);background:var(--card-3);border:1px solid var(--line-2);box-shadow:var(--sombra);font-size:13.5px}
.aviso.ok{border-color:rgba(34,197,94,.35)} .aviso.ok .aviso-ico{color:var(--verde)}
.aviso.erro{border-color:rgba(239,68,68,.35)} .aviso.erro .aviso-ico{color:#f87171}
.aviso.info .aviso-ico{color:var(--azul-2)}
.aviso-ico{flex:none;font-size:14px}
.aviso strong{display:block;margin-bottom:1px}
.aviso p{color:var(--ink-3);font-size:12.5px}
@media (prefers-reduced-motion:no-preference){
  .aviso{animation:subir .26s ease}
  @keyframes subir{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
}

.faixa-offline{
  position:fixed;top:0;left:0;right:0;z-index:95;display:none;
  align-items:center;justify-content:center;gap:9px;
  padding:9px 16px;background:var(--vermelho);color:#fff;font-weight:700;font-size:13px;
}
.faixa-offline.ativa{display:flex}

/* ─── gaveta tecnica ────────────────────────────────────────────────────── */
.gaveta{
  position:fixed;bottom:0;left:var(--esq);right:0;z-index:70;
  background:var(--card);border-top:1px solid var(--line-2);
  transform:translateY(calc(100% - 38px));transition:transform .28s cubic-bezier(.4,0,.2,1);
  max-height:min(70dvh,620px);display:flex;flex-direction:column;
}
.gaveta.aberta{transform:translateY(0)}
@media (prefers-reduced-motion:reduce){.gaveta{transition:none}}
.gaveta-puxador{display:flex;align-items:center;gap:10px;padding:0 20px;height:38px;width:100%;cursor:pointer;background:none;border:0;color:var(--ink-3);font-size:11px;font-weight:700;letter-spacing:.1em}
.gaveta-puxador:hover{color:var(--ink-2)}
.gaveta-conteudo{padding:0 20px 20px;overflow-y:auto;font-family:var(--mono);font-size:11.5px}
.gaveta-linha{padding:10px 0;border-top:1px solid var(--line);display:grid;grid-template-columns:120px 1fr auto;gap:14px}
.gaveta-tipo{color:var(--roxo-2);font-weight:700}
.gaveta-dado{color:var(--ink-3);word-break:break-all;line-height:1.65}
.gaveta-dado b{color:var(--ink-2);font-weight:500}
.gaveta-link{color:var(--azul-2)}
.gaveta-link:hover{text-decoration:underline}
.gaveta-vazia{padding:24px 0;color:var(--ink-3);text-align:center}

/* ─── detalhe ───────────────────────────────────────────────────────────── */
.detalhe-grade{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:18px}
.etapas{display:flex;flex-direction:column}
.etapa{display:flex;gap:12px;padding-bottom:15px;position:relative}
.etapa:not(:last-child)::before{content:'';position:absolute;left:9px;top:21px;bottom:0;width:2px;background:var(--line-2)}
.etapa.feita:not(:last-child)::before{background:var(--azul)}
.etapa-bola{width:20px;height:20px;flex:none;border-radius:50%;background:var(--card-3);border:2px solid var(--line-2);display:grid;place-items:center;font-size:10px;z-index:1}
.etapa.feita .etapa-bola{background:var(--azul);border-color:var(--azul);color:#fff}
.etapa.atual .etapa-bola{border-color:var(--azul-2);box-shadow:0 0 0 4px rgba(96,165,250,.16)}
.etapa-texto{font-size:13.5px;font-weight:600;padding-top:1px}
.etapa:not(.feita):not(.atual) .etapa-texto{color:var(--ink-3);font-weight:500}

.conversa{display:flex;flex-direction:column;gap:9px;max-height:320px;overflow-y:auto;padding:2px}
.balao{max-width:78%;padding:9px 13px;border-radius:13px;font-size:13.5px;line-height:1.45}
.balao.deles{background:var(--card-3);border-bottom-left-radius:4px;align-self:flex-start}
.balao.meu{background:rgba(59,130,246,.18);border:1px solid rgba(59,130,246,.3);border-bottom-right-radius:4px;align-self:flex-end}
.balao-autor{font-size:11px;color:var(--ink-3);margin-bottom:2px;font-weight:700}
.balao.pendente{opacity:.55}

/* ─── certificados ──────────────────────────────────────────────────────── */
.cert-grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.cert{border-radius:var(--r-lg);overflow:hidden;border:1px solid var(--line);background:var(--card);cursor:pointer;text-align:left;width:100%;font:inherit;color:inherit;padding:0;transition:border-color .16s,transform .16s;display:block}
.cert:hover{border-color:var(--line-2);transform:translateY(-2px)}
.cert img{display:block;width:100%;aspect-ratio:1000/620;object-fit:cover;background:var(--card-2)}
.cert-info{padding:13px 15px;display:flex;align-items:center;gap:11px}
.cert-horas{font-family:var(--mono);font-size:19px;font-weight:700;color:var(--azul-2)}
.cert-titulo{font-size:13px;font-weight:700;line-height:1.3}
.cert-sub{font-size:11.5px;color:var(--ink-3);margin-top:1px}
.cert-estado{margin-left:auto;font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:6px}
.cert-estado.pronto{background:rgba(34,197,94,.12);color:var(--verde)}
.cert-estado.processando{background:rgba(245,158,11,.12);color:var(--laranja)}

/* ─── metricas ──────────────────────────────────────────────────────────── */
.metricas{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:13px}
.metrica{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px}
.metrica-valor{font-family:var(--mono);font-size:24px;font-weight:700;line-height:1.1}
.metrica-rotulo{font-size:11.5px;color:var(--ink-3);margin-top:4px}

/* ─── verificacao publica ───────────────────────────────────────────────── */
.verificacao{max-width:900px;margin:0 auto;padding:40px 22px 90px}
.selo{display:inline-flex;align-items:center;gap:9px;padding:7px 15px;border-radius:999px;font-weight:700;font-size:13.5px;margin-bottom:20px}
.selo.valido{background:rgba(34,197,94,.11);border:1px solid rgba(34,197,94,.3);color:var(--verde)}
.selo.parcial{background:rgba(245,158,11,.11);border:1px solid rgba(245,158,11,.3);color:var(--laranja)}
.selo.invalido{background:rgba(239,68,68,.11);border:1px solid rgba(239,68,68,.3);color:#f87171}

/* ─── responsivo ────────────────────────────────────────────────────────── */
@media (max-width:1280px){
  .app.ativo{grid-template-columns:var(--esq) minmax(0,1fr)}
  .dir{display:none}
  .detalhe-grade{grid-template-columns:1fr}
}
@media (max-width:880px){
  .app.ativo{grid-template-columns:1fr}
  .esq{position:static;height:auto;flex-direction:row;align-items:center;gap:10px;padding:12px 14px;border-right:0;border-bottom:1px solid var(--line);overflow-x:auto}
  .esq .marca{padding:0 10px 0 0}
  /* Sem espaco para o nome: fica so o simbolo. */
  .esq .marca-imagem{
    width:30px;
    -webkit-mask-image:url('/marca/simbolo');
            mask-image:url('/marca/simbolo');
  }
  .nav{flex-direction:row;gap:5px}
  .nav-grupo,.esq-rodape{display:none}
  .nav-item{white-space:nowrap;padding:8px 12px}
  .gaveta{left:0}
  .entrar-grade,.linha-2,.escolha{grid-template-columns:1fr}
  .heroi{padding:22px}
  .heroi h1{font-size:26px}
  .heroi-arte{display:none}
  .topo{padding:12px 14px}
  .conteudo{padding:4px 14px 70px}
}
</style>
</head>
<body>

<a class="pular" href="#conteudo">Pular para o conteudo</a>

<div class="faixa-offline" id="faixa-offline" role="status">
  <span aria-hidden="true">⚠</span>
  <span>Sem conexao com o servico. Suas acoes vao esperar aqui ate a conexao voltar.</span>
</div>

<div class="app" id="app">
  <aside class="esq">
    <a class="marca" href="#" id="ir-inicio" aria-label="Uni.work, ir para o inicio">
      <span class="marca-imagem"></span>
    </a>

    <nav class="nav" id="nav" aria-label="Navegacao principal"></nav>

    <div class="esq-rodape">
      <h4 id="cta-titulo">Contrate com garantia</h4>
      <p id="cta-texto">Publique um trampo, reserve o valor e pague na confirmacao.</p>
      <button class="esq-cta" id="cta-botao">
        <span class="faisca" aria-hidden="true">⚡</span>
        <span id="cta-rotulo">Publicar vaga</span>
      </button>
      <div class="esq-vivo">
        <span class="ponto-vivo" aria-hidden="true"></span>
        <span>ao vivo</span>
      </div>
      <button class="esq-link" data-view="verificar">Verificar certificado</button>
      <button class="esq-link" data-view="painel">Painel do ecossistema</button>
    </div>
  </aside>

  <div class="centro">
    <header class="topo">
      <div class="busca">
        <svg class="busca-lupa" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true">
          <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
        </svg>
        <label class="sr" for="busca">Buscar trampos</label>
        <input id="busca" type="search" placeholder="Buscar trampos">
        <kbd aria-hidden="true">/</kbd>
      </div>
      <div class="topo-acoes" id="topo-acoes"></div>
    </header>

    <main class="conteudo" id="conteudo" tabindex="-1"></main>
  </div>

  <aside class="dir" id="dir" aria-label="Painel do ecossistema"></aside>
</div>

<div id="verificacao" hidden></div>

<div class="avisos" id="avisos" role="status" aria-live="polite"></div>
<div id="modal-raiz"></div>

<!-- A gaveta tecnica e a unica parte do produto que fala a lingua da rede.
     Ela existe para demonstracao. data-camada-tecnica marca o limite: o teste
     de vocabulario ignora tudo que estiver dentro dela e so dentro dela. -->
<section class="gaveta" id="gaveta" data-camada-tecnica="true" aria-label="Camada tecnica">
  <button class="gaveta-puxador" id="gaveta-puxador" aria-expanded="false" aria-controls="gaveta-conteudo">
    <span aria-hidden="true">◆</span>
    <span>CAMADA TECNICA</span>
    <span id="gaveta-resumo" style="margin-left:auto;font-weight:500;letter-spacing:0"></span>
  </button>
  <div class="gaveta-conteudo" id="gaveta-conteudo"></div>
</section>

<script src="/app.js" type="module"></script>
